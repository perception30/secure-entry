name: secure-entry
services:
  gateway:
    build: .
    init: true
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?Set OIDC_JWKS_URI in .env}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      BACKEND_URL: http://backend:3001
      GATEWAY_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    networks: [edge, backend]
    depends_on: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  backend:
    build: .
    init: true
    command: ['node', 'dist/backend/src/server.js']
    environment:
      BACKEND_HOST: 0.0.0.0
    networks: [backend]
    # No published port: external callers cannot forge the trusted identity header.
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
networks:
  edge: {}
  backend:
    internal: true
